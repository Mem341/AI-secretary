AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AI-secretary — personal Telegram secretary (Google Calendar, Gmail) for one owner.
  One Lambda behind a Function URL serves every endpoint; a second Lambda runs the daily cron.
  Build first: `npm ci && npm run build:aws`, then `sam deploy` from the aws/ folder.
  See .claude/skills/deploy-aws/SKILL.md and docs/deploy-aws.md.

Parameters:
  OwnerTelegramId:
    Type: String
    Description: Your numeric Telegram ID (@userinfobot). The bot answers only this person.
  TelegramBotToken:
    Type: String
    NoEcho: true
    Description: Bot token from @BotFather.
  OpenRouterApiKey:
    Type: String
    NoEcho: true
    Description: OpenRouter API key (https://openrouter.ai/keys).
  PublicUrl:
    Type: String
    Default: ""
    Description: Optional custom domain. Empty = the Function URL, detected from the first request.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth client ID (docs/what-you-need.md, section 4).
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
  ZoomAccountId:
    Type: String
    Default: ""
  ZoomClientId:
    Type: String
    Default: ""
  ZoomClientSecret:
    Type: String
    Default: ""
    NoEcho: true
  GmailPubsubTopic:
    Type: String
    Default: ""
    Description: Optional projects/<id>/topics/<name> for instant new-mail notifications.
  LlmModel:
    Type: String
    Default: ""
    Description: Optional OpenRouter model id (default google/gemini-2.5-flash).
  OwnerName:
    Type: String
    Default: ""
    Description: Optional. Empty = your Telegram name.
  OwnerPosition:
    Type: String
    Default: ""
  OwnerPhone:
    Type: String
    Default: ""
  DefaultDurationMin:
    Type: String
    Default: "60"
  DefaultFormat:
    Type: String
    Default: offline
    AllowedValues: [offline, google_meet, zoom]
  DefaultAddress:
    Type: String
    Default: ""
  EncryptionKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional. Empty = derived from the bot token. Changing it means reconnecting Google.
  CronSecret:
    Type: String
    Default: ""
    NoEcho: true

Conditions:
  HasPublicUrl: !Not [!Equals [!Ref PublicUrl, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 60
    CodeUri: ../dist/aws/
    Environment:
      Variables:
        OWNER_TELEGRAM_ID: !Ref OwnerTelegramId
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        OPENROUTER_API_KEY: !Ref OpenRouterApiKey
        PUBLIC_URL: !Ref PublicUrl
        GOOGLE_CLIENT_ID: !Ref GoogleClientId
        GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
        ZOOM_ACCOUNT_ID: !Ref ZoomAccountId
        ZOOM_CLIENT_ID: !Ref ZoomClientId
        ZOOM_CLIENT_SECRET: !Ref ZoomClientSecret
        GMAIL_PUBSUB_TOPIC: !Ref GmailPubsubTopic
        LLM_MODEL: !Ref LlmModel
        ENCRYPTION_KEY: !Ref EncryptionKey
        CRON_SECRET: !Ref CronSecret
        OWNER_NAME: !Ref OwnerName
        OWNER_POSITION: !Ref OwnerPosition
        OWNER_PHONE: !Ref OwnerPhone
        DEFAULT_DURATION_MIN: !Ref DefaultDurationMin
        DEFAULT_FORMAT: !Ref DefaultFormat
        DEFAULT_ADDRESS: !Ref DefaultAddress

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: aws.handler
      Description: Telegram webhook, Google push, OAuth, setup page.
      FunctionUrlConfig:
        AuthType: NONE
        # Streaming: the answer goes out first, background work (LLM, sync) finishes afterwards.
        InvokeMode: RESPONSE_STREAM

  CronFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: aws.cronHandler
      Description: Daily renewal of Google push channels and safety-net calendar sync.
      Timeout: 300
      Environment:
        Variables:
          # The cron has no request to learn the address from: it gets the Function URL here.
          PUBLIC_URL: !If [HasPublicUrl, !Ref PublicUrl, !GetAtt ApiFunctionUrl.FunctionUrl]
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(17 3 * * ? *)
            ScheduleExpressionTimezone: UTC

Outputs:
  FunctionUrl:
    Description: Open <FunctionUrl>api/setup to finish the setup (registers the Telegram webhook).
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  GoogleRedirectUri:
    Description: Authorized redirect URI for the Google OAuth client (when PublicUrl is empty).
    Value: !Sub "${ApiFunctionUrl.FunctionUrl}api/oauth/callback"
